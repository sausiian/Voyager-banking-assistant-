services:
  # ===================================================
  # Voyager Frontend (React + Vite + Tailwind)
  # ===================================================
  voyager-frontend:
    container_name: voyager-frontend
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "5173:5173"
    volumes:
      # Mount current directory for real-time live code reloading
      - .:/app
      # Anonymous volume to preserve Linux node_modules inside container
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - VITE_PORT=5173
    stdin_open: true
    tty: true
    restart: unless-stopped
    networks:
      - voyager-net

  # ===================================================
  # Voyager Backend (Future Python FastAPI integration)
  # Uncomment once you are ready to connect your backend
  # ===================================================
  # voyager-backend:
  #   container_name: voyager-backend
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile
  #   ports:
  #     - "8000:8000"
  #   volumes:
  #     - ./backend:/app
  #   environment:
  #     - ENVIRONMENT=development
  #   command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
  #   restart: unless-stopped
  #   networks:
  #     - voyager-net

networks:
  voyager-net:
    driver: bridge
